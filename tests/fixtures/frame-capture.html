<script>
const check = (value, message) => { if (!value) throw new Error(message); };

  if (new URLSearchParams(location.search).has("report")) {
    reportFetch("/test-result", {method:"POST", body:message}).catch(error => console.error("Could not report fixture result", error));

};
const wait = ms => new Promise(resolve => setTimeout(resolve,ms));
const until = async predicate => { for (let i=0;i<150;i++) { if (predicate()) return; await wait(10); } throw new Error("Timed out waiting for video/capture"); };
const imagePixels = async src => {
  const image = new Image(); image.src = src; await until(() => image.complete && image.naturalWidth);
  const canvas = document.createElement("canvas"); canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
  const context = canvas.getContext("2d"); context.drawImage(image,0,0);
  return {width:canvas.width,height:canvas.height,pixel:context.getImageData(48,18,1,1).data};
};
(async () => {

  check(!$("#frame-tools").hidden && $("#frame").disabled && $("#frame-review").hidden, "capture tools visible with initial loaded-frame guard");

  await until(() => video.readyState >= 2 && !$("#frame").disabled);
  check(video.videoWidth === 64 && video.videoHeight === 36, "real video decoded");

  check($("#form").dirty() && saves === 0 && uploads.length === 0, "capture stages artwork without saving");
  check($("#pv-cover img").src === $("#frame-review img").src

  const pendingArt = $("#pv-cover img").src;

  $("#frame-discard").click();
  check($("#pv-cover img").src === pendingArt && $("#form").dirty(), "discard restores a prior unsaved art choice");
  const nativeBlob = HTMLCanvasElement.prototype.toBlob;
  HTMLCanvasElement.prototype.toBlob = function(callback) { callback(null); };
  $("#frame").click();
  check($("#frame-status").textContent.includes("Could not capture") && $("#pv-cover img").src === pendingArt, "encoding failure is explicit and preserves artwork");

  check($("#frame-status").textContent.includes("already saved video") && $("#pv-cover img").src === pendingArt, "cross-origin capture error guides local import");

  $("#frame-back").click(); await until(() => !video.seeking && !$("#frame").disabled);
  check(video.paused && video.currentTime === 0, "back control seeks and clamps to start");
  $("#frame").click(); await until(() => !$("#frame-review").hidden);

  const uploaded = await imagePixels(URL.createObjectURL(uploads[0].file));
