<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Package UI test</title>
<link rel="stylesheet" href="/web/style.css"></head><body>
<button id="jobsbtn">Jobs</button>
<dialog id="dlg"></dialog><dialog id="odlg"></dialog><dialog id="qdlg"></dialog>
<dialog id="gdlg"></dialog><dialog id="bdlg"></dialog><dialog id="idlg"></dialog>
<dialog id="ndlg"></dialog><dialog id="sdlg"></dialog><dialog id="pdlg"></dialog><dialog id="rdlg"></dialog>
<pre id="result">RUNNING</pre>
<script>
function sfx() {}
function notify() {}
let submitted = [], failApprove = false, blockApproval = true, importFailed = false;
let catalogOffline = false, installerReady = true, downloadStatus = "succeeded";
let pickerPath = "/home/test/Game Files", pickerFailed = false;
const digest = "sha256:" + "a".repeat(64), jobDigest = "sha256:" + "b".repeat(64);
const summary = { id: "test-game", version: "1.0.0", name: "<img src=x onerror='throw 1'> Test", digest, platform_issues: [] };
const detail = { ...summary, home_games: "/home/test/Games",
  dependencies: { flycast: { flatpak_available: true, installed: true, version: "v2.7", capabilities_checked: false } }, manifest: {
  inputs: [{ id: "source_dir", type: "directory", required: true },
    { id: "games_root", type: "directory", required: true, default: "home_games" },
    { id: "mode", type: "choice", choices: ["fast", "careful"], default: "careful" },
    { id: "optional", type: "boolean", default: false }],
  destination_name: "Test", platform: {}, actions: { network: [], privileges: [] }, requires: [], testing: {}
}};
const job = { id: "j00000001", title: "Install Test", status: "awaiting-approval", done: 1, total: 2,
  plan_digest: jobDigest, actions: [], surviving: 0, manual: false };
const plan = { ...job, plan: { game_directory: "/home/test/Games/Test",
  actions: [{ op: "replace", ownership: "managed", path: "/home/test/bin/game",
    before: { kind: "file" }, after: { kind: "file" }, backup: "/home/test/backups/game" }],
  dependencies: { flycast: { installed: true } }, preserve: [{ path: "/home/test/save" }],
  state_destinations: ["/home/test/state"], manual_actions: [{ message: "Confirm aiming and fullscreen" }] }};
function reply(data, status = 200) { return Promise.resolve(new Response(JSON.stringify(data), { status })); }
fetch = async path => {
  if (path === "/api/packages") return reply({ packages: installerReady ? [summary] : [] });
  if (path === "/api/catalog") return catalogOffline ? reply({ error: "Cannot load available games: offline" }, 502)
    : reply({ catalog_version: 1, games: [{
      ...summary, description: "Bring your own game files.", icon_url: "/web/icon.svg"
    }] });
  if (path === "/api/jobs/j00000002") return reply({ id: "j00000002", kind: "download", status: downloadStatus,
    package_id: "test-game", package_version: "1.0.0", progress: { current: 50, total: 100 },
    error: downloadStatus === "failed" ? "Checksum mismatch" : null });
  if (path === "/api/packages/test-game/1.0.0") return reply(detail);
  if (path.startsWith("/api/jobs/")) return reply({ ...plan,
    ...(blockApproval ? { approval_blocked: "Session 5 capability checks required" } : {}) });
  throw new Error("Unexpected GET " + path);
};
async function post(path, body, raw) {
  submitted.push({ path, body, raw });
  if (path === "/api/picker/directory") return pickerFailed ? reply({ error: "Cannot open folder picker" }, 400) : reply({ path: pickerPath });
  if (path === "/api/packages/import-upload") return importFailed ? reply({ error: "Invalid ZIP" }, 400) : reply(summary);
  if (path === "/api/packages/import") return reply(summary);
  if (path === "/api/packages/install") return reply({ id: job.id });
  if (path === "/api/packages/download") return reply({ id: "j00000002" });
  if (path === "/api/dependencies/flycast/prepare") return reply({ id: job.id });
  if (path.endsWith("/approve")) return failApprove ? reply({ error: "The plan changed; review it again" }, 409) : reply({ status: "approve" });
  if (path.endsWith("/cancel")) { if (path === "/api/jobs/j00000002/cancel") downloadStatus = "cancelled"; return reply({ status: "cancel" }); }
  throw new Error("Unexpected POST " + path);
}
async function refresh() { handleJobs([job]); }
</script>
<script src="/web/core.js"></script><script src="/web/gamepad.js"></script>
<script src="/web/jobs.js"></script><script src="/web/packages.js"></script>
<script>
const tick = () => new Promise(resolve => setTimeout(resolve, 0));
function check(value, message) { if (!value) throw new Error(message); }
async function until(fn) {
  for (let i = 0; i < 100; i++) { if (fn()) return; await tick(); }
  throw new Error("Timed out waiting for UI");
}
(async () => {
  games = [{ id: "existing", name: "My existing entry" }];
  openJobs(); $("#ipackages").click(); await tick();
  check(!$("#iprepare"), "no standalone emulator decision");
  check(topDlg().id === "pdlg", "package dialog has controller focus");
  await until(() => $("[data-game]"));
  check(!$("#catalog-advanced").open, "manual import and existing-game editor are advanced options");
  check($("#catalog-games h3").textContent === summary.name, "catalog metadata escaped");
  check($("#catalog-games img").getAttribute("src") === "/web/icon.svg", "catalog card artwork only");
  check($("[data-game]").textContent.includes("Continue setup"), "validated imported installer reuses setup");
  $("[data-game]").click(); await until(() => $("#pkg-setup"));
  check($("#pkg-preflight").disabled, "catalog selection never skips trust");
  $("#pkg-back").click(); await until(() => $("[data-game]"));
  installerReady = false;
  $("#catalog-retry").click(); await until(() => !$("#catalog-retry").disabled);
  downloadStatus = "failed"; $("[data-game]").click();
  await until(() => !$("#pdlg .pkg-error").hidden);
  check($("#pdlg .pkg-error").textContent.includes("Checksum mismatch"), "download error visible");
  downloadStatus = "running"; $("[data-game]").click();
  await until(() => $("#catalog-progress").value === 50);
  check($("#pdlg .pkg-error").hidden, "retry clears previous download error");
  $("#catalog-cancel").click(); await until(() => downloadStatus === "cancelled");
  followDownload("j00000002");
  await until(() => !$("#pdlg .pkg-error").hidden);
  check($("#pdlg .pkg-error").textContent.includes("cancelled"), "cancellation allows retry");
  downloadStatus = "running"; $("[data-game]").click();
  await until(() => !$("#catalog-download").hidden);
  check(!$("#catalog-cancel").disabled, "a retried download can also be cancelled");
  $("#pkg-close").click();
  check(downloadStatus === "running", "closing dialog leaves background download running");
  openPackages(); await until(() => $("[data-game]"));
  $("[data-game]").click(); await until(() => !$("#catalog-download").hidden);
  check($("#catalog-progress").value === 50, "reopening can follow the existing download");
  $("#pkg-close").click(); openPackages(); await until(() => $("[data-game]"));
  downloadStatus = "succeeded"; $("[data-game]").click();
  await until(() => $("#pkg-setup"));
  check(submitted.some(s => s.path === "/api/packages/download" && s.body.id === "test-game"), "game choice requests pinned backend download");
  check(!submitted.some(s => s.path === "/api/packages/install"), "download never runs install");
  $("#pkg-back").click(); await until(() => $("[data-game]"));
  catalogOffline = true; $("#catalog-retry").click();
  await until(() => !$("#catalog-retry").disabled);
  check($("#pdlg .pkg-error").textContent.includes("offline"), "offline catalog error visible");
  check($("#catalog-import"), "offline retains manual import");
  catalogOffline = false; installerReady = true;
  await until(() => $("#catalog-import"));
  $("#catalog-advanced").open = true;
  $("#catalog-import").click(); await tick();
  check(!$("#pdlg img"), "package metadata is escaped");
  $("#pkg-path").value = "/home/test/package-folder"; $("#pkg-import-path").click();
  await until(() => !$("#pkg-import-path").disabled);
  check(submitted.some(s => s.body?.path === "/home/test/package-folder"), "folder import sends absolute path");
  const files = new DataTransfer(); files.items.add(new File(["zip"], "package.zip"));
  $("#pkg-file").files = files.files; $("#pkg-file").dispatchEvent(new Event("change"));
  await until(() => !$("#pkg-zip").disabled);
  check(submitted.some(s => s.raw instanceof File), "ZIP uses raw file upload");
  importFailed = true;
  const invalidFiles = new DataTransfer(); invalidFiles.items.add(new File(["invalid"], "invalid.zip"));
  $("#pkg-file").files = invalidFiles.files; $("#pkg-file").dispatchEvent(new Event("change"));
  await until(() => !$("#pkg-zip").disabled);
  check($(".pkg-error").textContent.includes("Invalid ZIP"), "upload error surfaced");
  await selectPackage("test-game", "1.0.0");
  check($("#pkg-preflight").disabled, "trust is mandatory");
  check($("#pkg-input-games_root").value === "/home/test/Games", "home_games resolved");
  check($("#pkg-input-source_dir").closest("label").textContent.includes("Where are your game files?"), "plain-language game source");
  check($("#pdlg").textContent.includes("leaves your originals untouched"), "original files reassurance");
  check($("#pkg-destination").textContent === "/home/test/Games/Test", "complete default game destination");
  check(!$("#pkg-input-games_root").closest("details").open, "destination customization starts collapsed");
  const sourceBrowse = $('[data-input="pkg-input-source_dir"]');
  sourceBrowse.click(); await until(() => !sourceBrowse.disabled);
  check($("#pkg-input-source_dir").value === "/home/test/Game Files", "native source selection fills full path");
  pickerPath = null; sourceBrowse.click(); await until(() => !sourceBrowse.disabled);
  check($("#pkg-input-source_dir").value === "/home/test/Game Files", "cancel preserves typed or selected path");
  pickerFailed = true; sourceBrowse.click(); await until(() => !sourceBrowse.disabled);
  check($("#pdlg .pkg-error").textContent.includes("folder picker"), "desktop picker failure visible");
  pickerFailed = false; pickerPath = "/media/Game Library";
  const destinationBrowse = $('[data-input="pkg-input-games_root"]');
  destinationBrowse.click(); await until(() => !destinationBrowse.disabled);
  check($("#pkg-destination").textContent === "/media/Game Library/Test", "folder picker refreshes destination preview");
  $("#pkg-input-games_root").value = "/media/Game Library/";
  $("#pkg-input-games_root").dispatchEvent(new Event("input"));
  check($("#pkg-destination").textContent === "/media/Game Library/Test", "destination preview follows changes");
  $("#pkg-input-games_root").value = "/";
  $("#pkg-input-games_root").dispatchEvent(new Event("input"));
  check($("#pkg-destination").textContent === "/Test", "root destination preview");
  $("#pkg-input-games_root").value = "relative";
  $("#pkg-input-games_root").dispatchEvent(new Event("input"));
  check($("#pkg-destination").textContent.includes("full folder path"), "invalid path not shown as destination");
  $("#pkg-input-games_root").value = "/home/test/Games";
  $("#pkg-input-games_root").dispatchEvent(new Event("input"));
  detail.id = "the-house-of-the-dead-2";
  await selectPackage("test-game", "1.0.0");
  check($("#pdlg").textContent.includes("CUE file and all matching BIN tracks together"), "HOD file requirements visible");
  check($("#pdlg").textContent.includes("package ZIP does not contain the game"), "package versus game explained");
  detail.id = "test-game";
  await selectPackage("test-game", "1.0.0");
  check($("#pkg-input-mode").value === "careful", "choice default retained");
  check($("#pdlg").textContent.includes("v2.7"), "detected dependency version shown");
  check($("#pdlg").textContent.includes("not be automatically upgraded"), "dependency reuse promise shown");
  check($("#pdlg").textContent.includes("need matching compatibility evidence"), "untested package gate explained");
  $("#pkg-input-mode").focus(); activate();
  check($("#pkg-input-mode").value === "fast", "controller cycles choice");
  $("#pkg-input-mode").value = "careful";
  $("#pkg-input-source_dir").value = "/home/test/disc";
  $("#pkg-association").value = "existing";
  $("#pkg-trust").click(); check(!$("#pkg-preflight").disabled, "trust enables preflight");
  $("#pkg-setup").requestSubmit();
  await until(() => !$("#pdlg").open && $("#idlg [data-a=review]"));
  const install = submitted.find(s => s.path === "/api/packages/install");
  check(install.body.trusted_digest === digest, "trust bound to digest");
  check(install.body.inputs.optional === false, "boolean false stays typed");
  check(install.body.inputs.mode === "careful", "choice sent");
  check(install.body.catalog_entry_id === "existing", "explicit association sent");
  check(install.body.inputs.source_dir === "/home/test/disc", "existing game folder sent unchanged");
  check(install.body.inputs.games_root === "/home/test/Games", "default installation root sent");
  check(!$("#pdlg").open && $("#idlg").open, "returns to jobs");
  check(!$("#idlg [data-a=approve]"), "no unreviewed approve shortcut");
  $("#idlg [data-a=review]").click(); await until(() => $("#plan-approve"));
  check(topDlg().id === "rdlg", "review dialog controller focus");
  const bounds = $("#rdlg").getBoundingClientRect();
  check(bounds.left >= 0 && bounds.right <= innerWidth && bounds.height <= innerHeight,
    "plan dialog stays inside the viewport");
  check($("#rdlg").textContent.includes("/home/test/backups/game"), "backup shown");
  check($("#rdlg").textContent.includes("Confirm aiming"), "manual setup shown");
  check($("#plan-approve").disabled && $("#plan-consent").disabled, "capability gate disables approval");
  $("#plan-close").click(); blockApproval = false;
  await reviewPackagePlan(job.id);
  $("#plan-consent").click(); check(!$("#plan-approve").disabled, "plan consent enables approval");
  failApprove = true; $("#plan-approve").click(); await until(() => !$("#rdlg .pkg-error").hidden);
  check($("#rdlg .pkg-error").textContent.includes("plan changed"), "stale plan error shown");
  check($("#plan-approve").disabled && !$("#plan-consent").checked, "stale consent reset");
  failApprove = false; $("#plan-consent").click(); $("#plan-approve").click(); await until(() => !$("#rdlg").open);
  check(!$("#rdlg").open, "successful approval closes review");
  check(jobPct({ status: "running", done: 1, total: 2, progress: { current: 10, total: 40 } }) === 25, "progress is step-local");
  check(jobPct({ status: "running", done: 1, total: 2 }) === 0, "unknown totals do not invent percentage");
  check(jobSub({ installation: "installed", readiness: "setup-required", actions: [] }).includes("setup required"), "readiness is separate from success");
  const approved = submitted.find(s => s.path.endsWith("/approve"));
  check(approved.body.plan_digest === jobDigest, "approval uses reviewed digest");
  $("#idlg").close(); openPackages(); await tick();
  detail.install_enabled = true;
  await selectPackage("test-game", "1.0.0");
  check($("#pdlg").textContent.includes("supported by compatibility evidence"), "enabled target evidence explained");
  check($("#pkg-preflight").disabled && !$("#pkg-trust").checked, "enabled target still requires trust");
  detail.platform_issues = ["Wrong architecture"];
  await selectPackage("test-game", "1.0.0"); $("#pkg-trust").click();
  check($("#pkg-preflight").disabled, "unsupported platform blocked");
  $("#pdlg").close();
  openJobs();
  plan.plan.operation = "prepare-dependency";
  plan.plan.dependency_commands = [["flatpak", "install", "--user", "--noninteractive", "-y", "flathub", "org.flycast.Flycast"]];
  await reviewPackagePlan(job.id);
  check($("#rdlg").textContent.includes("--noninteractive"), "exact dependency command shown");
  check($("#plan-approve").textContent.includes("required software"), "game-focused software approval");
  check($("#plan-approve").disabled, "dependency approval also requires explicit consent");
  $("#plan-close").click();
  plan.plan.dependency_commands = [];
  plan.plan.dependency_download = { url: "https://github.com/trzy/Supermodel/releases/download/pinned/runtime.tar.gz", sha256: "a".repeat(64) };
  await reviewPackagePlan(job.id);
  check($("#rdlg").textContent.includes("pinned official GitHub release"), "native software download is clearly explained");
  check($("#rdlg").textContent.includes("runtime.tar.gz"), "exact native software asset shown");
  check($("#plan-approve").disabled, "native software still requires explicit consent");
  $("#plan-close").click(); $("#idlg").close();
  detail.platform_issues = [];
  detail.dependencies = { supermodel: { installed: false, provider: "native", scope: "user" } };
  detail.manifest.inputs[0].help = "Keep your compatible lamachin.zip zipped in one folder.";
  openPackages(); await selectPackage("test-game", "1.0.0");
  check($("#pdlg").textContent.includes("lamachin.zip"), "game-specific source requirements visible");
  check($("#pdlg").textContent.includes("pinned official release after your approval"), "native dependency setup explained");
  check($("#pkg-preflight").disabled, "native packages retain publisher trust gate");
  $("#pdlg").close();
  detail.dependencies = { vkquake: { installed: false, provider: "appimage", scope: "user" } };
  detail.manifest.inputs[0].help = "Choose your Quake folder with id1/pak0.pak and id1/pak1.pak. Episode Enyo is already bundled.";
  openPackages(); await selectPackage("test-game", "1.0.0");
  check($("#pdlg").textContent.includes("Episode Enyo is already bundled"), "bundled mod and base-file requirements shown");
  check($("#pdlg").textContent.includes("pinned official release after your approval"), "AppImage preparation is game-focused");
  check($("#pkg-preflight").disabled && !$("#pkg-trust").checked, "AppImage setup still requires package trust");
  $("#pdlg").close();
  check(jobSub({ kind: "dependency", status: "succeeded" }).includes("No game installed"), "dependency success does not imply game success");
  document.querySelector("#result").textContent = "PASS: imports, trust, plan, controller focus, platform, capability gates and game software review";
})().catch(error => { document.querySelector("#result").textContent = "FAIL: " + error.stack; });
</script></body></html>
