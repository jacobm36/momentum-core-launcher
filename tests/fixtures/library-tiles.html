let edited = null, folders = null, errors = [], requests = [];
const openFolders = g => { folders = g.id; };
const openStats = () => {}, cycleTheme = () => {};
const notify = message => errors.push(message);
const collection = Array.from({length:60}, (_, i) => ({
  id:"game-" + i, name:"Game " + i + " with a long readable title", category:"Arcade",
  tags:i % 2 ? ["Action"] : ["Action", "Mouse"], description:"A description.",
  ...(i === 0 ? {cover:"web/logo-full.png", icon:"web/icon-256.png", video:"missing.webm"} : {}),
  ...(i === 1 ? {icon:"web/icon-256.png"} : {}),
  ...(i === 3 ? {cover:"missing-cover.png", icon:"web/icon-256.png"} : {}),
  ...(i === 4 ? {icon:"missing-icon.png"} : {})
}));
let runningIds = [];
window.fetch = async (path, options) => {
  if (path === "/api/games") return {json:async () => ({games:collection, token:"test", running:runningIds, stats:{}})};
  requests.push(path);
  if (path.startsWith("/api/favorite/")) collection.find(g => path.endsWith(g.id)).favorite = JSON.parse(options.body).on;
  if (path.startsWith("/api/delete/")) collection.splice(collection.findIndex(g => path.endsWith(g.id)), 1);
  if (path === "/api/reorder") {
    const items = JSON.parse(options.body).items;
    const next = items.map(item => ({...collection.find(g => g.id === item.id), category:item.category}));
    collection.splice(0, collection.length, ...next);
  }
  return {json:async () => ({status:"launched"})};
};
const reopened = sessionStorage.getItem("tiles-reopen") === "yes";
if (!reopened) localStorage.clear();
localStorage.setItem("mcl-anim", "off");
</script>
